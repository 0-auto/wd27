<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        div{
            border: 1px solid #f00;
            padding: 10px 20px;
            /* border-radius: 0 32px 0 0; */
        }
        #chrome{
            /* chrome/edge/firefox */
            width: 393px;
            height: 540px;
        }
        #safari{
            /* safari */
            width: 393px;
            height: 699px;
            /* height: 694px; */
            border-radius: 0 32px 32px 0;
        }
        @media (min-width:768px){
            #chrome{
                width: 410px;
            }
        }
    </style>
</head>
<body>
    <div id="chrome">
        <h2>Chrome/Edge/Firefox</h2>
        <p>ああああああああああいいいいいいいいいいあ<br>
            1行の文字数は全角21文字（16px）</p>
    </div>
    <div id="safari">
        <h2>Safari</h2>
        <p>ああああああああああいいいいいいいいいいあ<br>
            1行の文字数は全角21文字（16px）</p>
    </div>
</body>
</html>
