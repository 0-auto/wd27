<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        div{
            border: 1px solid #f00;
            padding: 10px 20px;
            border-radius: 0 32px 0 0;
        }
        #chrome{
            /* chrome/edge/firefox */
            width: 390px;
            height: 535px;
        }
        #safari{
            /* safari */
            width: 392px;
            height: 695px;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div id="chrome">ああああああああああいいいいいいいいいいあ1行の文字数は全角21文字（16px）</div>
    <div id="safari">ああああああああああいいいいいいいいいいあ1行の文字数は全角21文字（16px）</div>
</body>
</html>
